[package]
name = "arena360-tools"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Arena360 operator commands, fixtures, and maintenance workers"

[features]
default = []
duckdb-analytics = ["gaming-cafe-api/duckdb-analytics", "dep:duckdb"]
duckdb-bundled = ["duckdb-analytics", "gaming-cafe-api/duckdb-bundled", "duckdb/bundled"]

[dependencies]
gaming-cafe-api.workspace = true
tokio.workspace = true
sqlx.workspace = true
duckdb = { workspace = true, optional = true }
serde_json.workspace = true
bcrypt.workspace = true
utoipa.workspace = true
uuid.workspace = true
chrono.workspace = true
dotenvy.workspace = true
async-nats.workspace = true

[[bin]]
name = "openapi-gen"
path = "src/bin/openapi_gen.rs"

[dev-dependencies]
axum.workspace = true
tower.workspace = true
object_store.workspace = true
async-trait.workspace = true
jsonwebtoken.workspace = true
rust_decimal.workspace = true
futures.workspace = true
flate2.workspace = true
