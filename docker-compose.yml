services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: arena360
      POSTGRES_PASSWORD: arena360
      POSTGRES_DB: arena360_control
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena360 -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: arena360
    entrypoint:
      - sh
      - -ec
      - >-
        if [ "$(psql -h postgres -U arena360 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'arena360_control'")" != 1 ]; then psql -h postgres -U arena360 -d postgres -c 'CREATE DATABASE arena360_control OWNER arena360'; fi
    depends_on:
      postgres:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "6432:5432"
    environment:
      DATABASE_URL: postgres://arena360:arena360@postgres:5432/arena360_control
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  # Local stand-in for Wasabi (S3-compatible; ADR-0043). Development only: S3 auth is disabled.
  object-storage:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage-init:
    image: chrislusf/seaweedfs:4.48
    entrypoint:
      - sh
      - -ec
      - >-
        buckets=$(echo 's3.bucket.list' | weed shell -master=object-storage:9333);
        if ! echo "$$buckets" | grep -Eq '^[[:space:]]*arena360[[:space:]]'; then
          echo 's3.bucket.create -name arena360' | weed shell -master=object-storage:9333;
        fi
    restart: "no"
    depends_on:
      object-storage:
        condition: service_healthy


volumes:
  pgdata:
  objectdata:
