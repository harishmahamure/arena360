syntax = "proto3";

package arena360.v1;

// The first protobuf cutover preserves the existing domain handler contract
// inside a binary envelope. Services are split by domain so callers cannot
// accidentally grow a single, unowned catch-all surface.
message ProxyRequest {
  string method = 1;
  string path = 2;
  string query = 3;
  bytes body_json = 4;
  map<string, string> headers = 5;
}

message ProxyResponse {
  uint32 status_code = 1;
  bytes body_json = 2;
  map<string, string> headers = 3;
}

service AuthService { rpc Invoke(ProxyRequest) returns (ProxyResponse); }
service UserService { rpc Invoke(ProxyRequest) returns (ProxyResponse); }
service DeviceService { rpc Invoke(ProxyRequest) returns (ProxyResponse); }
service PlanService { rpc Invoke(ProxyRequest) returns (ProxyResponse); }
service SessionService { rpc Invoke(ProxyRequest) returns (ProxyResponse); }
service TransactionService { rpc Invoke(ProxyRequest) returns (ProxyResponse); }
service ShiftCashService { rpc Invoke(ProxyRequest) returns (ProxyResponse); }
service InventoryService { rpc Invoke(ProxyRequest) returns (ProxyResponse); }
service NotificationService { rpc Invoke(ProxyRequest) returns (ProxyResponse); }
service ConfigurationService { rpc Invoke(ProxyRequest) returns (ProxyResponse); }
service StatisticsService { rpc Invoke(ProxyRequest) returns (ProxyResponse); }
service UploadService { rpc Invoke(ProxyRequest) returns (ProxyResponse); }

