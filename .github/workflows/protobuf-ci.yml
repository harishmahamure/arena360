name: Protobuf and backend CI

on:
  push:
    branches: [main]
    paths: ['apps/backend/**', 'packages/proto/**', 'packages/utils/**', 'buf.yaml', 'buf.gen.yaml', 'pnpm-lock.yaml']
  pull_request:
    paths: ['apps/backend/**', 'packages/proto/**', 'packages/utils/**', 'buf.yaml', 'buf.gen.yaml', 'pnpm-lock.yaml']
  workflow_dispatch:

jobs:
  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:proto
      - name: Check breaking protobuf changes
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e origin/main:apps/backend/proto 2>/dev/null; then
            pnpm exec buf breaking --against '.git#branch=origin/main,subdir=apps/backend/proto'
          else
            echo "No protobuf baseline exists on main yet; lint and generation checks still apply."
          fi
      - name: Generated protobuf is current
        run: |
          pnpm gen:proto
          git diff --exit-code -- packages/proto/src/gen
      - run: pnpm --filter @gaming-cafe/proto typecheck
      - run: pnpm --filter @gaming-cafe/utils typecheck

  backend:
    runs-on: ubuntu-latest
    services:
      control-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena_test
          POSTGRES_PASSWORD: arena_test
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arena_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONTROL_TEST_ADMIN_DATABASE_URL: postgres://arena_test:arena_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/backend }
      - run: cargo clippy --all-targets --manifest-path apps/backend/Cargo.toml
      - run: pnpm backend:test:integration
