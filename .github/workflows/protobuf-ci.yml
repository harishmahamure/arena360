name: Protobuf and backend CI

on:
  push:
    branches: [main]
    paths: ['apps/backend/**', 'packages/proto/**', 'packages/utils/**', 'buf.yaml', 'buf.gen.yaml', 'pnpm-lock.yaml']
  pull_request:
    paths: ['apps/backend/**', 'packages/proto/**', 'packages/utils/**', 'buf.yaml', 'buf.gen.yaml', 'pnpm-lock.yaml']
  workflow_dispatch:

jobs:
  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:proto
      - name: Check breaking protobuf changes
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e origin/main:apps/backend/proto 2>/dev/null; then
            pnpm exec buf breaking --against '.git#branch=origin/main,subdir=apps/backend/proto'
          else
            echo "No protobuf baseline exists on main yet; lint and generation checks still apply."
          fi
      - name: Generated protobuf is current
        run: |
          pnpm gen:proto
          git diff --exit-code -- packages/proto/src/gen
      - run: pnpm --filter @gaming-cafe/proto typecheck
      - run: pnpm --filter @gaming-cafe/utils typecheck

  backend:
    runs-on: ubuntu-latest
    services:
      control-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena_test
          POSTGRES_PASSWORD: arena_test
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arena_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONTROL_TEST_ADMIN_DATABASE_URL: postgres://arena_test:arena_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/backend }
      - name: Disposable JetStream runtime
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.12.6/nats-server-v2.12.6-linux-amd64.tar.gz -o /tmp/nats-server.tar.gz
          echo '77fe7dd69ff5144126026b78355900be0ab0bb4339dc61a7621dcc9b9e9d07a6  /tmp/nats-server.tar.gz' | sha256sum --check
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          echo 'NATS_SERVER_BIN=/tmp/nats-server-v2.12.6-linux-amd64/nats-server' >> "$GITHUB_ENV"
      - name: Matching DuckDB shared library
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.5.6/libduckdb-linux-amd64.zip -o /tmp/duckdb.zip
          echo 'b845005f5132a7d8180057c35e14a7626632258782f871a90861b19c1c03841b  /tmp/duckdb.zip' | sha256sum --check
          unzip -q /tmp/duckdb.zip -d /tmp/arena360-duckdb
          echo 'DUCKDB_LIB_DIR=/tmp/arena360-duckdb' >> "$GITHUB_ENV"
          echo 'LD_LIBRARY_PATH=/tmp/arena360-duckdb' >> "$GITHUB_ENV"
      - run: cargo clippy --all-targets --features duckdb-analytics --manifest-path apps/backend/Cargo.toml
      - run: pnpm backend:test:integration
