postgresql:
  auth:
    username: arena360
    database: arena360
    existingSecret: arena360-postgresql-secrets
  persistence:
    enabled: true
    storageClassName: ""
    size: 50Gi

imagePullSecrets:
  - name: dockerhub-secret

pgbouncer:
  replicaCount: 2
  externalService:
    enabled: true
    type: NodePort
    port: 5433
    nodePort: 30433
    annotations: {}
    loadBalancerIP: ""
  config:
    poolMode: transaction
    maxClientConn: 500
    defaultPoolSize: 20
    reservePoolSize: 5

secret:
  create: false
  name: arena360-postgresql-secrets
