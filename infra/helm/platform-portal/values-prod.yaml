replicaCount: 2

image:
  repository: harishmahamure/arena360
  tag: portal-prod-latest
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: platform.arena360.cloud
  tlsSecretName: arena360-platform-portal-prod-tls

platformApiUpstream: http://arena360-backend:3000
