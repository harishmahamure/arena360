{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: {app: {{ .Release.Name }}-gateway}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-gateway}
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image | quote }}
          ports: [{name: http, containerPort: 3000}]
          envFrom: [{secretRef: {name: {{ .Values.existingSecret }}}}]
          env:
            - {name: PORT, value: "3000"}
            - {name: STORAGE_SERVICE_URL, value: {{ .Values.gateway.storageUrl | default (printf "http://%s-storage:3001" .Release.Name) | quote }}}
            - {name: STORAGE_CELL_ID, value: {{ .Values.storage.cellId | quote }}}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}

{{- end }}
