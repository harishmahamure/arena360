groups:
  - name: arena360-replication
    rules:
      - alert: TenantReplicationBehind
        expr: arena360_replication_oldest_unshipped_milliseconds > 150000
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Cell has WAL older than the replication recovery-point window"
      - alert: TenantReplicationSpoolGrowing
        expr: arena360_replication_spool_bytes > 1073741824
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Cell WAL spool exceeds 1 GiB"
      - alert: TenantReplicationFailures
        expr: increase(arena360_replication_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Cell WAL capture or upload is failing; inspect retained spool"
  - name: arena360-disk
    rules:
      - alert: CellDiskWarning
        expr: arena360_disk_zone == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cell filesystem is in the 70–80 percent warning zone"
      - alert: CellDiskCorrective
        expr: arena360_disk_zone == 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Cell disk pressure has paused backfills, exports, archive staging and maintenance"
      - alert: CellDiskCritical
        expr: arena360_disk_zone >= 3
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Cell disk is critical or cannot be measured; analytics growth is paused"
      - alert: CellDiskComponentScanIncomplete
        expr: arena360_disk_component_scan_complete == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cell component scan is partial; filesystem pressure measurement still controls admission"
