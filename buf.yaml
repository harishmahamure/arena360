version: v2
modules:
  - path: apps/backend/proto
lint:
  use:
    - STANDARD
  # The cutover gateway intentionally shares one binary compatibility envelope
  # across domain-owned services; new typed RPCs must follow standard naming.
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
